{% load static %}
<nav class="relative bg-surface-container-low border-b border-outline-variant sticky top-0 z-50 overflow-hidden">

    <img src="{% static 'images/kiri.webp' %}" alt=""
        style="width: 900px; height: 140px; filter: hue-rotate(150deg) saturate(1.1) brightness(0.4);"
        class="absolute bottom-0 left-0 object-cover object-left-bottom pointer-events-none select-none opacity-60">

    <img src="{% static 'images/kanan.webp' %}" alt=""
        style="width: 900px; height: 140px; filter: hue-rotate(150deg) saturate(1.1) brightness(0.4);"
        class="absolute top-0 right-0 h-16 w-40 object-contain object-right-top pointer-events-none select-none opacity-60">

    <div class="absolute inset-0 bg-gradient-to-r from-surface-container-low/80 via-surface-container-low/40 to-surface-container-low/80 pointer-events-none"></div>
    <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">

            <a href="{% url 'core:home' %}" class="flex items-center gap-3">
                <img src="{% static 'images/erasebg-transformed.webp' %}" alt="Logo Dinas Perdagangan Kota Samarinda" class="w-12 h-12 object-contain flex-shrink-0">
                <div class="flex flex-col leading-tight">
                    <span class="text-lg font-bold text-on-surface">UPTD Pasar Segiri</span>
                    <span class="text-xs text-on-surface-variant">Dinas Perdagangan Kota Samarinda</span>
                </div>
            </a>

            <div class="hidden md:flex items-center gap-8">
                <a href="{% url 'core:home' %}"
                   class="text-sm font-medium pb-1 border-b-2 tracking-wide {% if request.resolver_match.url_name == 'home' %}text-primary border-primary{% else %}text-on-surface-variant border-transparent hover:text-primary{% endif %}">
                    Beranda
                </a>
                <a href="{% url 'core:uptd_profile' %}"
                   class="text-sm font-medium pb-1 border-b-2 tracking-wide {% if request.resolver_match.url_name == 'uptd_profile' %}text-primary border-primary{% else %}text-on-surface-variant border-transparent hover:text-primary{% endif %}">
                    Profil UPTD
                </a>
                <a href="{% url 'market:market_unit' %}"
                   class="text-sm font-medium pb-1 border-b-2 tracking-wide {% if request.resolver_match.url_name == 'market_unit' %}text-primary border-primary{% else %}text-on-surface-variant border-transparent hover:text-primary{% endif %}">
                    Unit Pasar
                </a>
                <a href="{% url 'membership:membership' %}"
                   class="text-sm font-medium pb-1 border-b-2 tracking-wide {% if request.resolver_match.url_name == 'membership' %}text-primary border-primary{% else %}text-on-surface-variant border-transparent hover:text-primary{% endif %}">
                    Keanggotaan
                </a>
                <a href="{% url 'core:gallery' %}"
                   class="text-sm font-medium pb-1 border-b-2 tracking-wide {% if request.resolver_match.url_name == 'gallery' %}text-primary border-primary{% else %}text-on-surface-variant border-transparent hover:text-primary{% endif %}">
                    Galeri
                </a>
            </div>

            <button id="menu-toggle" type="button" class="md:hidden text-on-surface" aria-label="Buka menu">
                <svg id="icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <svg id="icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div id="mobile-menu" class="hidden md:hidden pb-4 flex flex-col gap-3">
            <a href="{% url 'core:home' %}" class="text-sm font-medium {% if request.resolver_match.url_name == 'home' %}text-primary{% else %}text-on-surface-variant{% endif %}">Beranda</a>
            <a href="{% url 'core:uptd_profile' %}" class="text-sm font-medium {% if request.resolver_match.url_name == 'uptd_profile' %}text-primary{% else %}text-on-surface-variant{% endif %}">Profil UPTD</a>
            <a href="{% url 'market:market_unit' %}" class="text-sm font-medium {% if request.resolver_match.url_name == 'market_unit' %}text-primary{% else %}text-on-surface-variant{% endif %}">Unit Pasar</a>
            <a href="{% url 'membership:membership' %}" class="text-sm font-medium {% if request.resolver_match.url_name == 'membership' %}text-primary{% else %}text-on-surface-variant{% endif %}">Keanggotaan</a>
            <a href="{% url 'core:gallery' %}" class="text-sm font-medium {% if request.resolver_match.url_name == 'gallery' %}text-primary{% else %}text-on-surface-variant{% endif %}">Galeri</a>
        </div>
    </div>
</nav>

<script>
    const menuToggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');
    const iconOpen = document.getElementById('icon-open');
    const iconClose = document.getElementById('icon-close');

    menuToggle.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        iconOpen.classList.toggle('hidden');
        iconClose.classList.toggle('hidden');
    });
</script>
