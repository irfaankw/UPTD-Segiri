{% extends "dashboard/base_dashboard.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">{% if mode == "edit" %}Edit{% else %}Tambah{% endif %} Unit Pasar</h1>
<form method="post" enctype="multipart/form-data" class="bg-white p-6 rounded-lg shadow space-y-4 max-w-3xl">
    {% csrf_token %}
    {% for field in form %}
    <div>
        <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p class="text-red-600 text-xs mt-1">{{ field.errors|join:", " }}</p>{% endif %}
    </div>
    {% endfor %}
    <div class="flex gap-3 pt-2">
        <button type="submit" class="bg-red-800 text-white px-5 py-2 rounded hover:bg-red-900">Simpan</button>
        <a href="{% url 'dashboard:unit_pasar_list' %}" class="px-5 py-2 rounded border">Batal</a>
    </div>
</form>
{% endblock %}
