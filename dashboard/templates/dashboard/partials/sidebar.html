<div class="adm-sidebar-foot">
    <div class="adm-user-row">
        <div class="adm-avatar">{{ user.get_full_name|default:user.username|slice:":2"|upper }}</div>
        <div>
            <p class="name">{{ user.get_full_name|default:user.username }}</p>
            <p class="role">Administrator</p>
        </div>
    </div>
    <div class="adm-foot-links">
        <a href="{% url 'core:home' %}" class="adm-foot-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 17l-5-5 5-5M15 12H5M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/></svg>
            <span class="txt">Kembali ke Website</span>
        </a>
        <form method="post" action="{% url 'dashboard:logout' %}">
            {% csrf_token %}
            <button type="submit" class="adm-foot-item is-danger">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                <span class="txt">Logout</span>
            </button>
        </form>
    </div>
</div>
